{% extends "base.html" %}

{% block title %}Add Product - Admin{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-sidebar">
        <h3>Admin Panel</h3>
        <nav class="admin-nav">
            <a href="/admin/" class="nav-item">Dashboard</a>
            <a href="/admin/products" class="nav-item active">Products</a>
            <a href="/admin/orders" class="nav-item">Orders</a>
        </nav>
    </div>

    <div class="admin-content">
        <h2>Add New Product</h2>

        <form method="post" class="admin-form">
            <div class="form-group">
                <label for="name">Product Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="brand">Brand *</label>
                    <input type="text" id="brand" name="brand" required>
                </div>
                <div class="form-group">
                    <label for="price">Price *</label>
                    <input type="number" id="price" name="price" step="0.01" required>
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option value="Classic">Classic</option>
                    <option value="Modern">Modern</option>
                    <option value="Sports">Sports</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="image">Image URL</label>
                <input type="url" id="image" name="image">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="movement">Movement</label>
                    <input type="text" id="movement" name="movement" placeholder="e.g., Automatic">
                </div>
                <div class="form-group">
                    <label for="water_resistance">Water Resistance</label>
                    <input type="text" id="water_resistance" name="water_resistance" placeholder="e.g., 100m">
                </div>
            </div>

            <div class="form-group">
                <label for="case_material">Case Material</label>
                <input type="text" id="case_material" name="case_material" placeholder="e.g., Gold">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Product</button>
                <a href="/admin/products" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
